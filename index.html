<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Continents">
<meta name="theme-color" content="#030f1b">
<title>Master of the Continents</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/motc.css">
</head>
<body>
<section id="title" class="screen" style="background:linear-gradient(#020a14,#06213a 55%,#0b3354)">
  <div class="stars-bg"></div><div class="moon"></div>
  <div class="title-wrap"><div class="k">A VOYAGE OF GEOGRAPHY</div><h1><small>MASTER OF THE</small>CONTINENTS</h1></div>
  <div class="galleon"><div id="galleon"></div></div>
  <svg class="waves" viewBox="0 0 1024 270" preserveAspectRatio="none"><path d="M0 90Q128 60 256 90T512 90T768 90T1024 90V270H0Z" fill="#0b3a5c" opacity=".85"/><path d="M0 130Q128 100 256 130T512 130T768 130T1024 130V270H0Z" fill="#082c47"/><path d="M0 175Q128 150 256 175T512 175T768 175T1024 175V270H0Z" fill="#051d31"/></svg>
  <div class="title-cta"><div id="nameRow" class="hidden"><input id="playerName" maxlength="16" placeholder="Sailor's name" autocomplete="off"></div>
    <button id="setSail" class="gbtn" style="font-size:26px;padding:15px 56px">SET SAIL</button><p id="titleStatus">Loading charts…</p></div>
</section>

<section id="chart" class="screen sea-bg hidden">
  <svg class="map" id="worldMap"></svg>
  <div class="hud"><div class="rank"><span class="ins" id="chartIns"></span><div class="txt"><small>Rank</small><span id="chartRank"></span></div></div>
    <div class="mid">Choose your voyage<small>Admiral of all 6 continents = Master of the Continents</small></div><span class="chip" id="chartChip"></span></div>
  <div id="pins"></div>
  <div class="chart-foot"><button class="obtn" id="btnRanks">Ranks</button><button class="obtn" id="btnSave">Save code</button><button class="obtn" id="btnTitle">Title</button></div>
</section>

<section id="hub" class="screen hidden">
  <div class="hud"><button class="back" data-go="chart">‹</button><div class="rank"><span class="ins" id="hubIns"></span><div class="txt"><small id="hubCont"></small><span id="hubRank"></span></div></div>
    <div class="mid"><span id="hubTitle"></span><small id="hubSub"></small></div><span class="chip" id="hubChip"></span></div>
  <div class="tracks" id="tracks"></div>
</section>

<section id="play" class="screen sea-bg hidden">
  <svg class="map" id="playMap"></svg>
  <div class="hud"><button class="back" id="playBack">‹</button><div class="rank"><span class="ins" id="playIns"></span><div class="txt"><small id="playKicker"></small><span id="playMode"></span></div></div>
    <div class="mid"><span id="playTitle"></span><small id="playSub"></small></div><span id="playPips" style="display:flex;gap:5px"></span></div>
  <div class="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zFit" aria-label="Fit map" style="font-size:16px">⤢</button></div>
  <div class="side" id="side"></div>
</section>

<div id="modal" class="modal hidden"><div class="card" id="card"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
