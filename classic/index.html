<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GeoGame">
<meta name="theme-color" content="#2a5bd7">
<title>Tom's GeoGame</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preload" href="../fonts/fredoka-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="menuBtn" class="pill hidden" aria-label="Back to menu">&larr; Menu</button>
    <div id="brand"><img src="../icon.svg" alt=""><span>Tom's <b>GeoGame</b></span></div>
    <div id="dots" class="hidden"></div>
    <div id="stats" class="hidden">
      <span id="streak" class="pill hidden"></span>
      <span id="score" class="pill"><i>&#9733;</i> <b>0</b></span>
    </div>
  </header>

  <main id="mapWrap">
    <svg id="map" role="img" aria-label="World map"></svg>
    <div id="zoomCtl">
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="zoomOut" aria-label="Zoom out">&minus;</button>
      <button id="zoomReset" aria-label="Reset zoom">&#8634;</button>
    </div>
    <div id="toast" class="hidden"></div>
  </main>

  <section id="prompt" class="hidden">
    <div id="question"></div>
    <div id="choices"></div>
    <div id="feedback"></div>
    <button id="nextBtn" class="btn primary hidden">Next &rarr;</button>
  </section>

  <section id="menu" class="overlay">
    <div class="card">
      <div class="hero">
        <img class="globe" src="../icon.svg" alt="">
        <h1>Tom's <span>GeoGame</span></h1>
        <p>How well do you know the world?</p>
      </div>
      <h2>Choose a game</h2>
      <div class="group modes" id="modeGroup">
        <button data-mode="find" class="opt mode"><span class="ico"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12" fill="#bfe3ff" stroke="#2a5bd7" stroke-width="5"/><path d="M29 29l11 11" stroke="#2a5bd7" stroke-width="7" stroke-linecap="round"/><path d="M14 17a7 7 0 0 1 6-5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg></span><span class="txt"><b>Find it</b><small>Tap the country on the map</small></span></button>
        <button data-mode="name" class="opt mode"><span class="ico"><svg viewBox="0 0 48 48"><path d="M4 12l13-5 14 5 13-5v29l-13 5-14-5-13 5z" fill="#c6f5be" stroke="#2f9e44" stroke-width="3" stroke-linejoin="round"/><path d="M17 7v29M31 12v29" stroke="#2f9e44" stroke-width="3"/><path d="M24 30s-8-7-8-13a8 8 0 0 1 16 0c0 6-8 13-8 13z" fill="#ff2e88" stroke="#fff" stroke-width="2"/><circle cx="24" cy="17" r="3" fill="#fff"/></svg></span><span class="txt"><b>Name it</b><small>Which country is flashing?</small></span></button>
        <button data-mode="capital" class="opt mode"><span class="ico"><svg viewBox="0 0 48 48"><path d="M6 17L24 6l18 11z" fill="#ffc531" stroke="#c27c00" stroke-width="3" stroke-linejoin="round"/><path d="M11 20v15M19 20v15M29 20v15M37 20v15" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/><rect x="6" y="36" width="36" height="6" rx="2" fill="#5a3fd6"/></svg></span><span class="txt"><b>Capitals</b><small>Pick the capital city</small></span></button>
      </div>
      <h2>Choose a region</h2>
      <div class="group regions" id="regionGroup"></div>
      <div class="startbar"><button id="startBtn" class="btn primary big">Let's go!</button></div>
      <p class="hint">Pinch or scroll to zoom &middot; drag to move the map</p>
    </div>
  </section>

  <section id="results" class="overlay hidden">
    <div class="card">
      <div id="trophy"></div>
      <h2 id="resultTitle"></h2>
      <div id="stars"></div>
      <p id="resultScore"></p>
      <p id="resultBest"></p>
      <div id="missed"></div>
      <div class="row">
        <button id="againBtn" class="btn primary">Play again</button>
        <button id="toMenuBtn" class="btn">Menu</button>
      </div>
    </div>
  </section>
  <canvas id="confetti"></canvas>
</div>
<script src="../vendor/d3.min.js"></script>
<script src="../vendor/topojson-client.min.js"></script>
<script src="game.js"></script>
</body>
</html>
